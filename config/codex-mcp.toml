# Merge these tables into ~/.codex/config.toml; never embed credentials.
[mcp_servers.github_standalone]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"
http_headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "issues,repos,actions" }
startup_timeout_sec = 60

# Exa's hosted MCP server; basic access requires no API key.
[mcp_servers.exa_standalone]
url = "https://mcp.exa.ai/mcp"
startup_timeout_sec = 60
